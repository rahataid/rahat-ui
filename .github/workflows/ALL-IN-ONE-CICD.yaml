name: ALL DEV CI/CD

on:
  workflow_dispatch:
    inputs:
      apps_to_build:
        description: "Apps to build (comma-separated: rahat-ui,community-tool-ui). Leave empty for all."
        required: false
        default: ""
        type: string
      tag_suffix:
        description: "Tag suffix (e.g., aa-dev)"
        required: true
        default: "aa-dev"
        type: string
      vault_secret_path:
        description: "Vault secret path"
        required: true
        type: choice
        options:
          # Dev folder
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/dev"
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/dev-qa"
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/stellar"
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/unicef"
          - "[DEV] github/data/rahat/rahat-ui/dev/el/crm"
          - "[DEV] github/data/rahat/rahat-ui/dev/unicef/aidlink"
          - "[DEV] github/data/rahat/rahat-ui/demo/aa/stellar"

          # Training
          - "[TRAIN] github/data/rahat/rahat-ui/traning/aa/mcn"
          - "[TRAIN] github/data/rahat/rahat-ui/traning/aa/nrcs"

          # Demo folder
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/mcn"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/redcross"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/testload"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/unicef"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aidlink"
          - "[DEMO] github/data/rahat/rahat-ui/demo/c2c/xcapita"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/dry-run-pin"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/gsma"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/mcn-2026"

          # Main folder
          - "[MAIN] github/data/rahat/rahat-ui/main/aa/geruwa"
          - "[MAIN] github/data/rahat/rahat-ui/main/aa/geruwarm"
          - "[MAIN] github/data/rahat/rahat-ui/main/aa/mcn"
          - "[MAIN] github/data/rahat/rahat-ui/main/cam-ken-merge"
          - "[MAIN] github/data/rahat/rahat-ui/prod/aa/demo"


      vault_secret_key:
        description: "Key within the Vault secret that holds the env (e.g., rahat-ui)"
        required: true
        default: "rahat-ui"
        type: string

env:
  CI: false
  REGISTRY: docker.io
  IMAGE_NAMESPACE: esatya

jobs:
  setup:
    name: Setup Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: set-matrix
        run: |
          APPS="${{ inputs.apps_to_build }}"
          if [ -z "$APPS" ]; then
            APPS="rahat-ui,community-tool-ui"
          fi
          JSON=$(printf '%s\n' "$APPS" | awk -F',' '{printf "["; for(i=1;i<=NF;i++) printf "\"%s\"%s",$i,(i==NF?"":","); printf "]"}')
          echo "matrix={\"app\":$JSON}" >> $GITHUB_OUTPUT

  build:
    name: Build & Push - ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    permissions:
      contents: read
      packages: write

