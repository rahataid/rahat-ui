      # -----------------------------
      # Docker Build & Push
      # -----------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.app }}
          push: true
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ inputs.tag_suffix }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ inputs.tag_suffix }}-${{ steps.meta.outputs.short_sha }}-${{ steps.meta.outputs.run_number }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.extract_version.outputs.version }}

      - name: Send Slack Alert on Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#ff0000'
          SLACK_TITLE: 'Build Failed — ${{ matrix.app }}'
          SLACK_MESSAGE: |
            *App:* `${{ matrix.app }}`
            *Tag:* `${{ inputs.tag_suffix }}`
            *Branch:* `${{ github.ref_name }}`
            *Actor:* `${{ github.actor }}`
            *Vault path:* `${{ steps.vault-path.outputs.VAULT_PATH }}`
      
            :point_right: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View full logs>
          SLACK_FOOTER: ''


    
