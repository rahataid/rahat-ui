name: ALL DEV CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create = build & deploy ephemeral env, destroy = tear one down"
        required: true
        default: "create"
        type: choice
        options:
          - "create"
          - "destroy"
      apps_to_build:
        description: "Apps to build (comma-separated: rahat-ui,community-tool-ui). Leave empty for all."
        required: false
        default: ""
        type: string
      tag_suffix:
        description: "Tag suffix (e.g., aa-dev)"
        required: true
        default: "aa-dev"
        type: string
      vault_secret_path:
        description: "Vault secret path"
        required: false
        type: choice
        options:
          # Dev folder
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/dev"
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/dev-qa"
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/stellar"
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/unicef"
          - "[DEV] github/data/rahat/rahat-ui/dev/el/crm"
          - "[DEV] github/data/rahat/rahat-ui/dev/unicef/aidlink"
          - "[DEV] github/data/rahat/rahat-ui/demo/aa/stellar"

          # Training
          - "[TRAIN] github/data/rahat/rahat-ui/traning/aa/mcn"
          - "[TRAIN] github/data/rahat/rahat-ui/traning/aa/nrcs"

          # Demo folder
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/mcn"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/redcross"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/testload"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/unicef"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aidlink"
          - "[DEMO] github/data/rahat/rahat-ui/demo/c2c/xcapita"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/dry-run-pin"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/gsma"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/mcn-2026"

          # Main folder
          - "[MAIN] github/data/rahat/rahat-ui/main/aa/geruwa"
          - "[MAIN] github/data/rahat/rahat-ui/main/aa/geruwarm"
          - "[MAIN] github/data/rahat/rahat-ui/main/aa/mcn"
          - "[MAIN] github/data/rahat/rahat-ui/main/cam-ken-merge"
          - "[MAIN] github/data/rahat/rahat-ui/prod/aa/demo"
      vault_secret_key:
        description: "Key within the Vault secret that holds the env (e.g., rahat-ui)"
        required: false
        default: "rahat-ui"
        type: string
      ttl_hours:
        description: "Hours before this ephemeral env auto-expires (only used on create)"
        required: false
        default: "4"
        type: string
      container_to_destroy:
        description: "Container name to tear down (only used on destroy, e.g. eph-rahat-ui-aa-dev-123)"
        required: false
        default: ""
        type: string

  # --- NEW: automatic PR preview environments ---
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  CI: false
  REGISTRY: docker.io
  IMAGE_NAMESPACE: esatya
  # Wildcard DNS *.dev.rahat.io -> dev VM IP is set once in Cloudflare (out of band).
  # The VM's existing nginx does the routing via a per-PR vhost generated from
  # /etc/nginx/templates/preview.conf.template (also set up out of band), so
  # no per-PR DNS work happens in this workflow at all.
  PREVIEW_DOMAIN: dev.rahat.io
  # Default Vault secret used for auto PR-preview builds (workflow_dispatch still
  # lets you pick a different path manually for one-off/ad-hoc deployments).
  PR_PREVIEW_VAULT_PATH: github/data/rahat/rahat-ui/dev/aa/dev
  PR_PREVIEW_VAULT_KEY: rahat-ui

permissions:
  contents: read

# ============================================================
# CONTEXT — normalizes workflow_dispatch inputs vs. pull_request
# event fields into one set of outputs every downstream job reads.
# This is the only place event-specific branching happens.
# ============================================================

jobs:
  context:
    name: Resolve Deployment Context
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      action: ${{ steps.ctx.outputs.action }}
      apps_to_build: ${{ steps.ctx.outputs.apps_to_build }}
      slug: ${{ steps.ctx.outputs.slug }}
      vault_secret_path: ${{ steps.ctx.outputs.vault_secret_path }}
      vault_secret_key: ${{ steps.ctx.outputs.vault_secret_key }}
      ttl_hours: ${{ steps.ctx.outputs.ttl_hours }}
      pr_number: ${{ steps.ctx.outputs.pr_number }}
    steps:
      - name: Compute context
        id: ctx
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            ACTION="create"
            if [ "${{ github.event.action }}" = "closed" ]; then
              ACTION="destroy"
            fi
            RAW_SLUG="pr-${PR_NUMBER}"
            VAULT_PATH="${PR_PREVIEW_VAULT_PATH}"
            VAULT_KEY="${PR_PREVIEW_VAULT_KEY}"
            TTL="0" # PR previews are cleaned up on close, not by TTL
            APPS=""
          else
            PR_NUMBER=""
            ACTION="${{ inputs.action }}"
            RAW_SLUG="${{ inputs.tag_suffix }}"
            RAW_VAULT_PATH="${{ inputs.vault_secret_path }}"
            VAULT_PATH="${RAW_VAULT_PATH#*] }"
            VAULT_KEY="${{ inputs.vault_secret_key }}"
            TTL="${{ inputs.ttl_hours }}"
            APPS="${{ inputs.apps_to_build }}"
          fi

          # DNS-label-safe slug: lowercase, [a-z0-9-] only, collapse repeats,
          # trim leading/trailing hyphens, cap at 63 chars (DNS label limit).
          SLUG=$(echo "$RAW_SLUG" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-z0-9-' '-' \
            | sed -E 's/-+/-/g; s/^-//; s/-$//' \
            | cut -c1-63)

          if [ -z "$SLUG" ]; then
            echo "ERROR: computed slug is empty — check tag_suffix/branch name"
            exit 1
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "apps_to_build=$APPS" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "vault_secret_path=$VAULT_PATH" >> "$GITHUB_OUTPUT"
          echo "vault_secret_key=$VAULT_KEY" >> "$GITHUB_OUTPUT"
          echo "ttl_hours=$TTL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  setup:
    name: Setup Build Matrix
    runs-on: ubuntu-latest
    needs: context
    if: needs.context.outputs.action == 'create'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: set-matrix
        run: |
          APPS="${{ needs.context.outputs.apps_to_build }}"
          if [ -z "$APPS" ]; then
            APPS="rahat-ui,community-tool-ui"
          fi
          JSON=$(printf '%s\n' "$APPS" | awk -F',' '{printf "["; for(i=1;i<=NF;i++) printf "\"%s\"%s",$i,(i==NF?"":","); printf "]"}')
          echo "matrix={\"app\":$JSON}" >> $GITHUB_OUTPUT

# ============================================================
# SECRET SCANNING / SAST / DEPENDENCY / LINT — unchanged
# ============================================================

  gitleaks:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/removed-pagiton-from-add-edit-activity'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Report Gitleaks result
        if: steps.gitleaks.outcome == 'failure'
        run: echo "::warning::Gitleaks detected secrets. Build will continue."

  sast-scan:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    needs: context
    if: needs.context.outputs.action == 'create'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: Dependency & Filesystem Scan
    runs-on: ubuntu-latest
    needs: context
    if: needs.context.outputs.action == 'create'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: 0

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    needs: context
    if: needs.context.outputs.action == 'create'
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile.rahat-ui
          - Dockerfile.community-tool-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

# ============================================================
# BUILD
# ============================================================

  build:
    name: Build & Push - ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs:
      - context
      - setup
      - sast-scan
      - dependency-scan
      - dockerfile-lint
    if: needs.context.outputs.action == 'create'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      run_number: ${{ steps.meta.outputs.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # For pull_request events, build the PR's head commit, not the merge ref
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Extract version dynamically
        id: extract_version
        run: |
          KEY="${{ matrix.app }}-version"
          VERSION=$(jq -r --arg k "$KEY" '.[$k]' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Import Secrets from Vault
        id: vault
        uses: hashicorp/vault-action@v2.4.0
        with:
          url: ${{ secrets.VAULT_URL }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            github/data/general/docker/esatya username | DOCKERHUB_USERNAME ;
            github/data/general/docker/esatya pat | DOCKERHUB_TOKEN ;
            ${{ needs.context.outputs.vault_secret_path }} ${{ needs.context.outputs.vault_secret_key }} | ENV ;

      - name: Debug Vault Output
        run: |
          echo "Vault path used: ${{ needs.context.outputs.vault_secret_path }}"
          echo "Vault key used: ${{ needs.context.outputs.vault_secret_key }}"
          echo "Loaded ENV variables:"
          echo "$ENV" | grep "NEXT_PUBLIC_API_HOST_URL"

      - name: Create environment file
        run: |
          if [ -z "$ENV" ]; then
            echo "ERROR: Vault secret is empty!"
            exit 1
          fi
          tee ./.env <<< "$ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract Git metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "run_number=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.app }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ needs.context.outputs.slug }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ needs.context.outputs.slug }}-${{ steps.meta.outputs.short_sha }}-${{ steps.meta.outputs.run_number }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.extract_version.outputs.version }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ needs.context.outputs.slug }}'
          format: cyclonedx-json
          output-file: sbom-${{ matrix.app }}.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: sbom-${{ matrix.app }}.json
          retention-days: 30

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign Docker image
        env:
          COSIGN_EXPERIMENTAL: "1"
        shell: bash
        run: |
          IMAGE="${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}"
          TAG="${{ needs.context.outputs.slug }}-${{ steps.meta.outputs.short_sha }}-${{ steps.meta.outputs.run_number }}"
          cosign sign --yes "${IMAGE}:${TAG}"

      - name: Send Slack Alert on Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#ff0000'
          SLACK_TITLE: 'Build Failed — ${{ matrix.app }}'
          SLACK_MESSAGE: |
            *App:* `${{ matrix.app }}`
            *Tag:* `${{ needs.context.outputs.slug }}`
            *Branch:* `${{ github.head_ref || github.ref_name }}`
            *Actor:* `${{ github.actor }}`
            :point_right: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View full logs>
          SLACK_FOOTER: ''

# ============================================================
# DEPLOY — deterministic name + Traefik labels, no port polling
# ============================================================

  deploy-ephemeral:
    name: Deploy Ephemeral Environment - ${{ matrix.app }}
    runs-on: arc-runner-set
    needs: [context, setup, build]
    if: needs.context.outputs.action == 'create'
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    outputs: {}
    steps:
      - name: Configure SSH access to dev VM
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_VM_SSH_PRIVATE_KEY }}" > ~/.ssh/dev_vm_key
          chmod 600 ~/.ssh/dev_vm_key
          ssh-keyscan -H "${{ secrets.DEV_VM_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Compute deterministic name, port, and hostname
        id: c
        run: |
          NAME="${{ needs.context.outputs.slug }}-${{ matrix.app }}"

          # App index used to keep two apps for the same PR on different ports.
          case "${{ matrix.app }}" in
            rahat-ui) APP_IDX=0 ;;
            community-tool-ui) APP_IDX=1 ;;
            *) APP_IDX=9 ;;
          esac

          # Falls back to the run number for manual (non-PR) dispatch, so the
          # port is still deterministic even without a PR number.
          NUMKEY="${{ needs.context.outputs.pr_number != '' && needs.context.outputs.pr_number || github.run_number }}"
          PORT=$((20000 + NUMKEY * 2 + APP_IDX))

          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "host=${NAME}.${PREVIEW_DOMAIN}" >> $GITHUB_OUTPUT
          echo "url=https://${NAME}.${PREVIEW_DOMAIN}" >> $GITHUB_OUTPUT

      - name: Import Docker Hub credentials from Vault
        uses: hashicorp/vault-action@v2.4.0
        with:
          url: ${{ secrets.VAULT_URL }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            github/data/general/docker/esatya username | DOCKERHUB_USERNAME ;
            github/data/general/docker/esatya pat | DOCKERHUB_TOKEN ;

      # Same name/port every time (PR#+app) — replace in place on synchronize
      # pushes instead of piling up containers per push. Container is bound
      # to 127.0.0.1 only; nginx (native, already on 80/443) is the only
      # thing that can reach it.
      - name: Deploy (replace-in-place) on dev VM behind existing nginx
        run: |
          ssh -i ~/.ssh/dev_vm_key -o StrictHostKeyChecking=no \
            "${{ secrets.DEV_VM_SSH_USER }}@${{ secrets.DEV_VM_SSH_HOST }}" bash -s << EOF
          set -e
          # Authenticate and pull fresh image on VM - prevents stale cache when NEXT_PUBLIC_* baked at build time
          # Image was verified locally with correct https://api-aa-dev.rahat.io (50 hits in /tmp/out), VM must pull same digest
          echo "${{ env.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin 2>/dev/null || true
          docker pull ${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ needs.context.outputs.slug }}-${{ needs.build.outputs.short_sha }}-${{ needs.build.outputs.run_number }}
          docker rm -f ${{ steps.c.outputs.name }} 2>/dev/null || true
          docker run -d \
            --name ${{ steps.c.outputs.name }} \
            -p 0.0.0.0:${{ steps.c.outputs.port }}:3000 \
            --label ephemeral=true \
            --label app=${{ matrix.app }} \
            --label pr=${{ needs.context.outputs.pr_number }} \
            --label created-at="\$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label ttl-hours="${{ needs.context.outputs.ttl_hours }}" \
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ needs.context.outputs.slug }}-${{ needs.build.outputs.short_sha }}-${{ needs.build.outputs.run_number }}

          sudo sed "s/__HOST__/${{ steps.c.outputs.host }}/g; s/__PORT__/${{ steps.c.outputs.port }}/g" \
            /etc/nginx/templates/preview.conf.template | sudo tee /etc/nginx/sites-available/${{ steps.c.outputs.name }}.conf > /dev/null
          sudo ln -sf /etc/nginx/sites-available/${{ steps.c.outputs.name }}.conf /etc/nginx/sites-enabled/${{ steps.c.outputs.name }}.conf
          sudo nginx -t
          sudo systemctl reload nginx
          EOF

      - name: Write job summary (Actions annotation for the link)
        run: |
          {
            echo "### 🚀 Preview ready — ${{ matrix.app }}"
            echo ""
            echo "**${{ steps.c.outputs.url }}**"
            echo ""
            echo "Expires: ${{ needs.context.outputs.pr_number != '' && 'when PR closes' || format('~{0}h', needs.context.outputs.ttl_hours) }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing preview comment for this app
        if: needs.context.outputs.pr_number != ''
        id: fc
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ needs.context.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- preview-comment:${{ matrix.app }} -->'

      - name: Post/update sticky PR comment with link
        if: needs.context.outputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ needs.context.outputs.pr_number }}
          edit-mode: replace
          body: |
            <!-- preview-comment:${{ matrix.app }} -->
            🚀 **${{ matrix.app }}** preview deployed: ${{ steps.c.outputs.url }}
            _Updated at ${{ github.event.pull_request.head.sha }}_

      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#36a64f'
          SLACK_TITLE: 'Ephemeral Environment Ready — ${{ matrix.app }}'
          SLACK_MESSAGE: |
            *URL:* ${{ steps.c.outputs.url }}
            *Container:* `${{ steps.c.outputs.name }}`
            *PR:* ${{ needs.context.outputs.pr_number || 'manual dispatch' }}
          SLACK_FOOTER: ''

# ============================================================
# DESTROY — manual (workflow_dispatch) path, unchanged
# ============================================================

  destroy-ephemeral:
    name: Destroy Ephemeral Environment (manual)
    runs-on: arc-runner-set
    needs: context
    if: needs.context.outputs.action == 'destroy' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate input
        run: |
          if [ -z "${{ inputs.container_to_destroy }}" ]; then
            echo "ERROR: container_to_destroy is required when action=destroy"
            exit 1
          fi
      - name: Configure SSH access to dev VM
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_VM_SSH_PRIVATE_KEY }}" > ~/.ssh/dev_vm_key
          chmod 600 ~/.ssh/dev_vm_key
          ssh-keyscan -H "${{ secrets.DEV_VM_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Remove container
        run: |
          ssh -i ~/.ssh/dev_vm_key -o StrictHostKeyChecking=no \
            "${{ secrets.DEV_VM_SSH_USER }}@${{ secrets.DEV_VM_SSH_HOST }}" \
            "docker rm -f ${{ inputs.container_to_destroy }} || echo 'not found'"
      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#999999'
          SLACK_TITLE: 'Ephemeral Environment Destroyed'
          SLACK_MESSAGE: |
            *Container:* `${{ inputs.container_to_destroy }}`
            *Actor:* `${{ github.actor }}`
          SLACK_FOOTER: ''

  # --- NEW: automatic teardown when a PR is closed/merged ---
  destroy-pr-preview:
    name: Destroy PR Preview
    runs-on: arc-runner-set
    needs: context
    if: needs.context.outputs.action == 'destroy' && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    strategy:
      matrix:
        app: [rahat-ui, community-tool-ui]
    steps:
      - name: Configure SSH access to dev VM
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_VM_SSH_PRIVATE_KEY }}" > ~/.ssh/dev_vm_key
          chmod 600 ~/.ssh/dev_vm_key
          ssh-keyscan -H "${{ secrets.DEV_VM_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Remove container + nginx vhost (name is deterministic — no manual input needed)
        run: |
          NAME="${{ needs.context.outputs.slug }}-${{ matrix.app }}"
          ssh -i ~/.ssh/dev_vm_key -o StrictHostKeyChecking=no \
            "${{ secrets.DEV_VM_SSH_USER }}@${{ secrets.DEV_VM_SSH_HOST }}" bash -s << EOF
          set -e
          docker rm -f $NAME 2>/dev/null || echo 'container not found (already gone)'
          sudo rm -f /etc/nginx/sites-enabled/$NAME.conf /etc/nginx/sites-available/$NAME.conf
          sudo nginx -t && sudo systemctl reload nginx
          EOF

      - name: Find existing preview comment for this app
        id: fc
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ needs.context.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- preview-comment:${{ matrix.app }} -->'

      - name: Update sticky PR comment
        if: steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ needs.context.outputs.pr_number }}
          edit-mode: replace
          body: |
            <!-- preview-comment:${{ matrix.app }} -->
            🧹 **${{ matrix.app }}** preview environment destroyed (PR closed).
