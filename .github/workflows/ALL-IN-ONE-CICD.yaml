name: ALL DEV CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create = build & deploy ephemeral env, destroy = tear one down"
        required: true
        default: "create"
        type: choice
        options:
          - "create"
          - "destroy"
      apps_to_build:
        description: "Apps to build (comma-separated: rahat-ui,community-tool-ui). Leave empty for all."
        required: false
        default: ""
        type: string
      tag_suffix:
        description: "Tag suffix (e.g., aa-dev)"
        required: true
        default: "aa-dev"
        type: string
      vault_secret_path:
        description: "Vault secret path"
        required: false
        type: choice
        options:
          # Dev folder
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/dev"
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/dev-qa"
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/stellar"
          - "[DEV] github/data/rahat/rahat-ui/dev/aa/unicef"
          - "[DEV] github/data/rahat/rahat-ui/dev/el/crm"
          - "[DEV] github/data/rahat/rahat-ui/dev/unicef/aidlink"
          - "[DEV] github/data/rahat/rahat-ui/demo/aa/stellar"

          # Training
          - "[TRAIN] github/data/rahat/rahat-ui/traning/aa/mcn"
          - "[TRAIN] github/data/rahat/rahat-ui/traning/aa/nrcs"

          # Demo folder
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/mcn"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/redcross"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/testload"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/unicef"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aidlink"
          - "[DEMO] github/data/rahat/rahat-ui/demo/c2c/xcapita"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/dry-run-pin"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/gsma"
          - "[DEMO] github/data/rahat/rahat-ui/demo/aa/mcn-2026"

          # Main folder
          - "[MAIN] github/data/rahat/rahat-ui/main/aa/geruwa"
          - "[MAIN] github/data/rahat/rahat-ui/main/aa/geruwarm"
          - "[MAIN] github/data/rahat/rahat-ui/main/aa/mcn"
          - "[MAIN] github/data/rahat/rahat-ui/main/cam-ken-merge"
          - "[MAIN] github/data/rahat/rahat-ui/prod/aa/demo"

      vault_secret_key:
        description: "Key within the Vault secret that holds the env (e.g., rahat-ui)"
        required: false
        default: "rahat-ui"
        type: string
      ttl_hours:
        description: "Hours before this ephemeral env auto-expires (only used on create)"
        required: false
        default: "4"
        type: string
      service_to_destroy:
        description: "Swarm service name to tear down (only used on destroy, e.g. eph-rahat-ui-aa-dev-123)"
        required: false
        default: ""
        type: string

env:
  CI: false
  REGISTRY: docker.io
  IMAGE_NAMESPACE: esatya

jobs:
  setup:
    name: Setup Build Matrix
    runs-on: ubuntu-latest
    if: ${{ inputs.action == 'create' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: set-matrix
        run: |
          APPS="${{ inputs.apps_to_build }}"
          if [ -z "$APPS" ]; then
            APPS="rahat-ui,community-tool-ui"
          fi
          JSON=$(printf '%s\n' "$APPS" | awk -F',' '{printf "["; for(i=1;i<=NF;i++) printf "\"%s\"%s",$i,(i==NF?"":","); printf "]"}')
          echo "matrix={\"app\":$JSON}" >> $GITHUB_OUTPUT

  build:
    name: Build & Push - ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ inputs.action == 'create' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      run_number: ${{ steps.meta.outputs.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version dynamically
        id: extract_version
        run: |
          KEY="${{ matrix.app }}-version"
          VERSION=$(jq -r --arg k "$KEY" '.[$k]' package.json)

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      # -----------------------------
      # Strip prefix from Vault secret path
      # -----------------------------
      - name: Strip prefix from Vault path
        id: vault-path
        run: |
          RAW_PATH="${{ inputs.vault_secret_path }}"
          CLEAN_PATH="${RAW_PATH#*] }"
          echo "VAULT_PATH=${CLEAN_PATH}" >> $GITHUB_OUTPUT

      # -----------------------------
      # Vault Secret Import
      # -----------------------------
      - name: Import Secrets from Vault
        id: vault
        uses: hashicorp/vault-action@v2.4.0
        with:
          url: ${{ secrets.VAULT_URL }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            github/data/general/docker/esatya username | DOCKERHUB_USERNAME ;
            github/data/general/docker/esatya pat | DOCKERHUB_TOKEN ;
            ${{ steps.vault-path.outputs.VAULT_PATH }} ${{ inputs.vault_secret_key }} | ENV ;

      # -----------------------------
      # Environment Injection
      # -----------------------------
      - name: Create environment file
        run: |
          if [ -z "$ENV" ]; then
            echo "ERROR: Vault secret is empty!"
            exit 1
          fi
          tee ./.env <<< "$ENV"

      # -----------------------------
      # Docker Setup
      # -----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract Git metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "run_number=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      # -----------------------------
      # Docker Build & Push
      # -----------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.app }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ inputs.tag_suffix }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ inputs.tag_suffix }}-${{ steps.meta.outputs.short_sha }}-${{ steps.meta.outputs.run_number }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.extract_version.outputs.version }}

      - name: Send Slack Alert on Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#ff0000'
          SLACK_TITLE: 'Build Failed — ${{ matrix.app }}'
          SLACK_MESSAGE: |
            *App:* `${{ matrix.app }}`
            *Tag:* `${{ inputs.tag_suffix }}`
            *Branch:* `${{ github.ref_name }}`
            *Actor:* `${{ github.actor }}`
            *Vault path:* `${{ steps.vault-path.outputs.VAULT_PATH }}`

            :point_right: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View full logs>
          SLACK_FOOTER: ''

  deploy-ephemeral:
    name: Deploy Ephemeral Environment - ${{ matrix.app }}
    # Runs on the ARC runner set that already lives in the private network,
    # since the Swarm manager isn't reachable from GitHub-hosted runners.
    # Replace this label with whatever your arc-runner-set is registered as.
    runs-on: [self-hosted, arc-runner-set]
    needs: [setup, build]
    if: ${{ inputs.action == 'create' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Configure SSH access to Swarm manager
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SWARM_SSH_PRIVATE_KEY }}" > ~/.ssh/swarm_key
          chmod 600 ~/.ssh/swarm_key
          ssh-keyscan -H "${{ secrets.SWARM_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "DOCKER_HOST=ssh://${{ secrets.SWARM_SSH_USER }}@${{ secrets.SWARM_SSH_HOST }}" >> $GITHUB_ENV
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/swarm_key -o StrictHostKeyChecking=no" >> $GITHUB_ENV

      - name: Compute ephemeral service name
        id: svc
        run: |
          SAFE_APP=$(echo "${{ matrix.app }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-')
          SAFE_TAG=$(echo "${{ inputs.tag_suffix }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-')
          SVC="eph-${SAFE_APP}-${SAFE_TAG}-${{ needs.build.outputs.run_number }}"
          echo "service=$SVC" >> $GITHUB_OUTPUT

      - name: Deploy service on Swarm
        run: |
          export DOCKER_HOST="ssh://${{ secrets.SWARM_SSH_USER }}@${{ secrets.SWARM_SSH_HOST }}"
          export DOCKER_SSH_OPTS="-i $HOME/.ssh/swarm_key -o StrictHostKeyChecking=no"

          docker service create \
            --name ${{ steps.svc.outputs.service }} \
            --label ephemeral=true \
            --label app=${{ matrix.app }} \
            --label created-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label ttl-hours="${{ inputs.ttl_hours }}" \
            --publish published=0,target=3000 \
            --with-registry-auth \
            --replicas 1 \
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ inputs.tag_suffix }}-${{ needs.build.outputs.short_sha }}-${{ needs.build.outputs.run_number }}

      - name: Resolve assigned port + build URL
        id: url
        run: |
          export DOCKER_HOST="ssh://${{ secrets.SWARM_SSH_USER }}@${{ secrets.SWARM_SSH_HOST }}"
          export DOCKER_SSH_OPTS="-i $HOME/.ssh/swarm_key -o StrictHostKeyChecking=no"

          # Port assignment can take a moment to appear
          for i in $(seq 1 15); do
            PORT=$(docker service inspect ${{ steps.svc.outputs.service }} \
              --format '{{ (index .Endpoint.Ports 0).PublishedPort }}' 2>/dev/null || echo "")
            [ -n "$PORT" ] && break
            sleep 2
          done

          if [ -z "$PORT" ]; then
            echo "ERROR: could not resolve published port"
            exit 1
          fi

          echo "url=http://${{ secrets.SWARM_SSH_HOST }}:${PORT}" >> $GITHUB_OUTPUT

      - name: Wait for service to be running
        run: |
          export DOCKER_HOST="ssh://${{ secrets.SWARM_SSH_USER }}@${{ secrets.SWARM_SSH_HOST }}"
          export DOCKER_SSH_OPTS="-i $HOME/.ssh/swarm_key -o StrictHostKeyChecking=no"

          for i in $(seq 1 30); do
            RUNNING=$(docker service ps ${{ steps.svc.outputs.service }} --filter "desired-state=running" --format '{{.CurrentState}}' | grep -c "Running" || true)
            [ "$RUNNING" -ge 1 ] && break
            sleep 5
          done

      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#36a64f'
          SLACK_TITLE: 'Ephemeral Environment Ready — ${{ matrix.app }}'
          SLACK_MESSAGE: |
            *URL:* ${{ steps.url.outputs.url }} (private network / VPN only)
            *Service:* `${{ steps.svc.outputs.service }}`
            *Expires in:* ${{ inputs.ttl_hours }}h (auto-cleanup)
            *Manual teardown:* re-run this workflow with `action=destroy` and `service_to_destroy=${{ steps.svc.outputs.service }}`
          SLACK_FOOTER: ''

  destroy-ephemeral:
    name: Destroy Ephemeral Environment
    runs-on: arc-runner-set
    if: ${{ inputs.action == 'destroy' }}
    steps:
      - name: Validate input
        run: |
          if [ -z "${{ inputs.service_to_destroy }}" ]; then
            echo "ERROR: service_to_destroy is required when action=destroy"
            exit 1
          fi

      - name: Configure SSH access to Swarm manager
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SWARM_SSH_PRIVATE_KEY }}" > ~/.ssh/swarm_key
          chmod 600 ~/.ssh/swarm_key
          ssh-keyscan -H "${{ secrets.SWARM_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Remove service
        run: |
          export DOCKER_HOST="ssh://${{ secrets.SWARM_SSH_USER }}@${{ secrets.SWARM_SSH_HOST }}"
          export DOCKER_SSH_OPTS="-i $HOME/.ssh/swarm_key -o StrictHostKeyChecking=no"
          docker service rm ${{ inputs.service_to_destroy }} || echo "Service not found, nothing to remove"

      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#999999'
          SLACK_TITLE: 'Ephemeral Environment Destroyed'
          SLACK_MESSAGE: |
            *Service:* `${{ inputs.service_to_destroy }}`
            *Actor:* `${{ github.actor }}`
          SLACK_FOOTER: ''
